name: Sync upstream v1

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: sync-upstream-v1
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare immutable candidate bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.candidate.outputs.changed }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      candidate_ref: ${{ steps.candidate.outputs.candidate_ref }}
      upstream_sha: ${{ steps.candidate.outputs.upstream_sha }}
      base_main_sha: ${{ steps.candidate.outputs.base_main_sha }}
      previous_upstream_sha: ${{ steps.candidate.outputs.previous_upstream_sha }}
      artifact_name: ${{ steps.candidate.outputs.artifact_name }}
      recovery_mode: ${{ steps.candidate.outputs.recovery_mode }}
    steps:
      - name: Check out trusted downstream main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Verify trusted workflow definition matches checkout
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          base_main_sha="$(git rev-parse HEAD)"
          workflow_sha="${WORKFLOW_SHA:-$GITHUB_SHA}"
          workflow_sha="${workflow_sha,,}"
          if ! [[ "$workflow_sha" =~ ^[0-9a-f]{40}$ ]] || [ "$base_main_sha" != "$workflow_sha" ]; then
            echo "::error title=Stale workflow definition::Checked out main is $base_main_sha, but this schedule/dispatch uses workflow $workflow_sha."
            exit 1
          fi

      - name: Verify standalone repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" != 'wed957/cherry-studio' ]; then
            echo "::error title=Repository scope violation::Expected wed957/cherry-studio, got $GITHUB_REPOSITORY."
            exit 1
          fi
          repo_json="$(gh api "repos/$GITHUB_REPOSITORY")"
          if ! jq -e '(.fork == false) and (.parent == null) and (.source == null)' \
            <<<"$repo_json" >/dev/null; then
            echo '::error title=Repository safety preflight failed::Automatic upstream sync requires a standalone repository (not a fork).'
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.27.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # Install before merging so no package or lifecycle script from upstream is executed here.
      - name: Install trusted patcher dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage isolated trusted patcher runtime
        shell: bash
        run: |
          set -euo pipefail

          trusted_patcher_dir="$RUNNER_TEMP/trusted-context-patcher"
          if [ -e "$trusted_patcher_dir" ] || [ -L "$trusted_patcher_dir" ]; then
            echo '::error title=Unsafe trusted runtime path::The isolated patcher directory already exists.'
            exit 1
          fi
          mkdir -p "$trusted_patcher_dir/node_modules"

          expected_patcher_blob="$(git rev-parse "HEAD:scripts/context-count-patch.ts")"
          cp -- scripts/context-count-patch.ts "$trusted_patcher_dir/context-count-patch.ts"
          if [ "$(git hash-object "$trusted_patcher_dir/context-count-patch.ts")" != "$expected_patcher_blob" ]; then
            echo '::error title=Trusted patcher copy mismatch::The isolated script differs from the checked-out control file.'
            exit 1
          fi

          typescript_dir="$(node -p "require('node:path').dirname(require.resolve('typescript/package.json'))")"
          if [ ! -d "$typescript_dir" ]; then
            echo '::error title=Missing trusted TypeScript runtime::The frozen install did not provide TypeScript.'
            exit 1
          fi
          cp -aL -- "$typescript_dir" "$trusted_patcher_dir/node_modules/typescript"

          if find "$trusted_patcher_dir" -type l -print -quit | grep -q . || \
            find "$trusted_patcher_dir" -mindepth 1 ! -type d ! -type f -print -quit | grep -q .; then
            echo '::error title=Unsafe trusted patcher runtime::Only ordinary files and directories are allowed.'
            exit 1
          fi

          isolated_version="$(
            cd "$trusted_patcher_dir"
            node -p "require('./node_modules/typescript/package.json').version"
          )"
          installed_version="$(node -p "require('typescript/package.json').version")"
          if [ "$isolated_version" != "$installed_version" ]; then
            echo '::error title=Trusted TypeScript copy mismatch::The isolated runtime version changed during staging.'
            exit 1
          fi

          # Keep dependency files out of the candidate worktree even if upstream changes ignore rules.
          rm -rf -- "$GITHUB_WORKSPACE/node_modules"
          if [ -e "$GITHUB_WORKSPACE/node_modules" ] || [ -L "$GITHUB_WORKSPACE/node_modules" ]; then
            echo '::error title=Trusted dependency cleanup failed::Workspace node_modules remained after isolation.'
            exit 1
          fi

          echo "TRUSTED_CONTEXT_PATCHER=$trusted_patcher_dir/context-count-patch.ts" >> "$GITHUB_ENV"

      - name: Merge upstream and create candidate bundle
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_REF: automation/upstream-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          ARTIFACT_NAME: upstream-candidate-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          disabled_hooks="$RUNNER_TEMP/disabled-git-hooks"
          mkdir "$disabled_hooks"
          git config core.hooksPath "$disabled_hooks"

          base_main_sha="$(git rev-parse HEAD)"
          remote_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$base_main_sha" != "$remote_main_sha" ]; then
            echo '::error title=Stale checkout::Main moved before candidate preparation started.'
            exit 1
          fi

          previous_upstream_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/upstream-v1" \
              --jq '.[] | select(.ref == "refs/heads/upstream-v1") | .object.sha'
          )"
          if [ -n "$previous_upstream_sha" ]; then
            if ! [[ "$previous_upstream_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo '::error title=Invalid tracked upstream::upstream-v1 did not resolve to a full commit SHA.'
              exit 1
            fi
            if ! git cat-file -e "$previous_upstream_sha^{commit}" 2>/dev/null || \
              ! git merge-base --is-ancestor "$previous_upstream_sha" "$base_main_sha"; then
              echo '::error title=Inconsistent upstream state::Tracked upstream-v1 is not available as an ancestor of downstream main.'
              exit 1
            fi
          fi

          git remote add upstream https://github.com/CherryHQ/cherry-studio.git 2>/dev/null || \
            git remote set-url upstream https://github.com/CherryHQ/cherry-studio.git
          if ! upstream_ref_line="$(git ls-remote --exit-code --heads upstream refs/heads/v1)"; then
            echo '::error title=Missing upstream ref::CherryHQ/cherry-studio does not advertise refs/heads/v1.'
            exit 1
          fi
          if ! [[ "$upstream_ref_line" =~ ^([0-9a-f]{40})[[:space:]]refs/heads/v1$ ]]; then
            echo '::error title=Invalid upstream ref::refs/heads/v1 was missing or ambiguously advertised.'
            exit 1
          fi
          advertised_upstream_sha="${BASH_REMATCH[1]}"
          git fetch --force --no-tags upstream \
            'refs/heads/v1:refs/remotes/upstream/v1'
          upstream_sha="$(git rev-parse refs/remotes/upstream/v1)"
          if [ "$upstream_sha" != "$advertised_upstream_sha" ]; then
            echo '::error title=Upstream moved during fetch::refs/heads/v1 changed after it was advertised; retry with a fresh snapshot.'
            exit 1
          fi

          if [ -n "$previous_upstream_sha" ] && \
            ! git merge-base --is-ancestor "$previous_upstream_sha" "$upstream_sha"; then
            {
              echo '## Candidate preparation failed'
              echo
              # Backticks are Markdown, not command substitution.
              # shellcheck disable=SC2016
              echo 'Upstream `v1` no longer advances from the tracked commit.'
              echo "Tracked upstream: \`$previous_upstream_sha\`"
              echo "Fetched upstream: \`$upstream_sha\`"
              echo
              echo 'Automatic sync refuses upstream rewrites or rewinds; review the history before changing the tracking ref.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo '::error title=Non-fast-forward upstream::Refusing to merge a rewritten or rewound upstream v1 history.'
            exit 1
          fi

          {
            echo "upstream_sha=$upstream_sha"
            echo "base_main_sha=$base_main_sha"
            echo "previous_upstream_sha=$previous_upstream_sha"
          } >> "$GITHUB_OUTPUT"

          if [ "$upstream_sha" = "$previous_upstream_sha" ]; then
            if ! git merge-base --is-ancestor "$upstream_sha" "$base_main_sha"; then
              echo '::error title=Inconsistent upstream state::Tracked upstream-v1 is not an ancestor of downstream main.'
              exit 1
            fi
            node --experimental-strip-types "$TRUSTED_CONTEXT_PATCHER" \
              --root src/renderer/src --require-targets --expected-targets 2 --expected-sliders 2

            immutable_tag="windows-$base_main_sha"
            immutable_query="$RUNNER_TEMP/immutable-health.json"
            rolling_query="$RUNNER_TEMP/rolling-health.json"
            immutable_assets="$RUNNER_TEMP/immutable-assets.txt"
            immutable_digests="$RUNNER_TEMP/immutable-digests.txt"

            query_release() {
              local tag="$1" destination="$2"
              gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                | jq -s --arg tag "$tag" \
                  '[.[][] | select(.tag_name == $tag)]' > "$destination"
            }

            resolve_tag_commit() {
              local tag="$1" object_json object_type object_sha
              object_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")"
              object_type="$(jq -r '.object.type' <<< "$object_json")"
              object_sha="$(jq -r '.object.sha' <<< "$object_json")"
              while [ "$object_type" = 'tag' ]; do
                object_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
                object_type="$(jq -r '.object.type' <<< "$object_json")"
                object_sha="$(jq -r '.object.sha' <<< "$object_json")"
              done
              [ "$object_type" = 'commit' ]
              printf '%s\n' "$object_sha"
            }

            verify_release_directory() {
              local directory="$1" all_assets="$2" checksum_assets="$3"
              local entry name line hash separator pattern count latest_count
              local invalid_entry=false
              declare -A seen_assets=()

              [ -d "$directory" ] && [ ! -L "$directory" ] || return 1
              while IFS= read -r -d '' entry; do
                invalid_entry=true
                break
              done < <(find "$directory" -mindepth 1 -maxdepth 1 ! -type f -print0)
              [ "$invalid_entry" = 'false' ] || return 1
              : > "$all_assets" || return 1
              while IFS= read -r -d '' entry; do
                name="${entry##*/}"
                case "$name" in . | .. | */* | *\\* | *[[:cntrl:]]*) return 1 ;; esac
                printf '%s\n' "$name" >> "$all_assets" || return 1
              done < <(find "$directory" -mindepth 1 -maxdepth 1 -type f -print0)
              LC_ALL=C sort -u -o "$all_assets" "$all_assets" || return 1
              test -s "$all_assets" || return 1
              grep -Fxq 'SHA256SUMS.txt' "$all_assets" || return 1
              : > "$checksum_assets" || return 1
              while IFS= read -r line || [ -n "$line" ]; do
                [ "${#line}" -ge 67 ] || return 1
                hash="${line:0:64}"
                separator="${line:64:2}"
                name="${line:66}"
                [[ "$hash" =~ ^[0-9a-f]{64}$ ]] && [ "$separator" = '  ' ] || return 1
                case "$name" in
                  '' | . | .. | */* | *\\* | *[[:cntrl:]]*) return 1 ;;
                  *.exe | *.zip | *.blockmap | latest*.yml) ;;
                  *) return 1 ;;
                esac
                [ "${seen_assets[$name]+present}" != 'present' ] || return 1
                seen_assets["$name"]=1
                printf '%s\n' "$name" >> "$checksum_assets" || return 1
              done < "$directory/SHA256SUMS.txt" || return 1
              test -s "$checksum_assets" || return 1
              LC_ALL=C sort -o "$checksum_assets" "$checksum_assets" || return 1
              awk '$0 != "SHA256SUMS.txt"' "$all_assets" > "$checksum_assets.actual" || return 1
              diff --unified "$checksum_assets" "$checksum_assets.actual" >/dev/null || return 1
              for pattern in \
                '*-arm64-portable.exe' \
                '*-arm64-setup.exe' \
                '*-x64-portable.exe' \
                '*-x64-setup.exe'; do
                count=0
                while IFS= read -r name; do
                  # shellcheck disable=SC2053
                  [[ "$name" == $pattern ]] && ((count += 1)) || true
                done < "$checksum_assets" || return 1
                [ "$count" -eq 1 ] || return 1
              done
              latest_count=0
              while IFS= read -r name; do
                [[ "$name" == latest*.yml ]] && ((latest_count += 1)) || true
              done < "$checksum_assets" || return 1
              [ "$latest_count" -ge 1 ] || return 1
              (cd "$directory" && sha256sum --strict --check SHA256SUMS.txt) >/dev/null || return 1
            }

            download_release_assets() {
              local release_id="$1" destination="$2" asset_manifest asset_list asset_id asset_name
              asset_manifest="$RUNNER_TEMP/health-download-assets.json"
              rm -rf -- "$destination" || return 1
              mkdir "$destination" || return 1
              gh api --paginate \
                "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
                | jq -s '[.[][]]' > "$asset_manifest" || return 1
              jq -e 'length > 0 and all(.[]; (.id | type) == "number" and (.name | type) == "string") and ((map(.name) | length) == (map(.name) | unique | length))' \
                "$asset_manifest" >/dev/null || return 1
              asset_list="$asset_manifest.tsv"
              jq -r '.[] | [.id, .name] | @tsv' "$asset_manifest" > "$asset_list" || return 1
              while IFS=$'\t' read -r asset_id asset_name; do
                case "$asset_name" in
                  '' | . | .. | */* | *\\* | *[[:cntrl:]]*) return 1 ;;
                esac
                curl --fail --location --silent --show-error \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H 'Accept: application/octet-stream' \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                  --output "$destination/$asset_name" || return 1
              done < "$asset_list" || return 1
            }

            check_immutable() (
              set -euo pipefail
              query_release "$immutable_tag" "$immutable_query"
              [ "$(jq 'length' "$immutable_query")" -eq 1 ]
              [ "$(jq -r '.[0].tag_name' "$immutable_query")" = "$immutable_tag" ]
              [ "$(jq -r '.[0].draft' "$immutable_query")" = 'false' ]
              [ "$(jq -r '.[0].prerelease' "$immutable_query")" = 'true' ]
              [ "$(jq -r '.[0].target_commitish' "$immutable_query")" = "$base_main_sha" ]
              release_id="$(jq -r '.[0].id' "$immutable_query")"
              tag_commit="$(resolve_tag_commit "$immutable_tag")"
              [ "$tag_commit" = "$base_main_sha" ]

              verification_dir="$RUNNER_TEMP/immutable-health-download"
              local_assets="$RUNNER_TEMP/immutable-local-assets.txt"
              local_digests="$RUNNER_TEMP/immutable-local-digests.txt"
              checksum_assets="$RUNNER_TEMP/immutable-checksum-assets.txt"
              downloaded=false
              for attempt in 1 2 3; do
                if download_release_assets "$release_id" "$verification_dir" && \
                  verify_release_directory "$verification_dir" "$local_assets" "$checksum_assets"; then
                  downloaded=true
                  break
                fi
                [ "$attempt" -lt 3 ] && sleep 3
              done
              [ "$downloaded" = 'true' ]

              while IFS= read -r asset; do
                printf '%s\tsha256:%s\n' "$asset" \
                  "$(sha256sum "$verification_dir/$asset" | awk '{print $1}')"
              done < "$local_assets" | LC_ALL=C sort > "$local_digests"

              healthy=false
              for attempt in 1 2 3 4 5; do
                gh api --paginate \
                  "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
                  --jq '.[].name' | LC_ALL=C sort > "$immutable_assets"
                gh api --paginate \
                  "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
                  --jq '.[] | [.name, .digest] | @tsv' \
                  | LC_ALL=C sort > "$immutable_digests"
                if diff --unified "$local_assets" "$immutable_assets" >/dev/null && \
                  diff --unified "$local_digests" "$immutable_digests" >/dev/null; then
                  healthy=true
                  break
                fi
                [ "$attempt" -lt 5 ] && sleep 3
              done
              [ "$healthy" = 'true' ]

              query_release "$immutable_tag" "$immutable_query"
              [ "$(jq 'length' "$immutable_query")" -eq 1 ]
              [ "$(jq -r '.[0].id' "$immutable_query")" = "$release_id" ]
              [ "$(jq -r '.[0].tag_name' "$immutable_query")" = "$immutable_tag" ]
              [ "$(jq -r '.[0].draft' "$immutable_query")" = 'false' ]
              [ "$(jq -r '.[0].prerelease' "$immutable_query")" = 'true' ]
              [ "$(jq -r '.[0].target_commitish' "$immutable_query")" = "$base_main_sha" ]
              [ "$(resolve_tag_commit "$immutable_tag")" = "$base_main_sha" ]
            )

            check_rolling() (
              set -euo pipefail
              query_release windows-latest "$rolling_query"
              [ "$(jq 'length' "$rolling_query")" -eq 1 ]
              [ "$(jq -r '.[0].tag_name' "$rolling_query")" = 'windows-latest' ]
              [ "$(jq -r '.[0].draft' "$rolling_query")" = 'false' ]
              [ "$(jq -r '.[0].prerelease' "$rolling_query")" = 'true' ]
              [ "$(jq -r '.[0].target_commitish' "$rolling_query")" = "$base_main_sha" ]
              release_id="$(jq -r '.[0].id' "$rolling_query")"
              tag_commit="$(resolve_tag_commit windows-latest)"
              [ "$tag_commit" = "$base_main_sha" ]

              rolling_assets="$RUNNER_TEMP/rolling-assets.txt"
              rolling_digests="$RUNNER_TEMP/rolling-digests.txt"
              healthy=false
              for attempt in 1 2 3 4 5; do
                gh api --paginate \
                  "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
                  --jq '.[].name' | LC_ALL=C sort > "$rolling_assets"
                gh api --paginate \
                  "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
                  --jq '.[] | [.name, .digest] | @tsv' \
                  | LC_ALL=C sort > "$rolling_digests"
                if diff --unified "$immutable_assets" "$rolling_assets" >/dev/null && \
                  diff --unified "$immutable_digests" "$rolling_digests" >/dev/null; then
                  healthy=true
                  break
                fi
                [ "$attempt" -lt 5 ] && sleep 3
              done
              [ "$healthy" = 'true' ]

              query_release windows-latest "$rolling_query"
              [ "$(jq 'length' "$rolling_query")" -eq 1 ]
              [ "$(jq -r '.[0].id' "$rolling_query")" = "$release_id" ]
              [ "$(jq -r '.[0].tag_name' "$rolling_query")" = 'windows-latest' ]
              [ "$(jq -r '.[0].draft' "$rolling_query")" = 'false' ]
              [ "$(jq -r '.[0].prerelease' "$rolling_query")" = 'true' ]
              [ "$(jq -r '.[0].target_commitish' "$rolling_query")" = "$base_main_sha" ]
              [ "$(resolve_tag_commit windows-latest)" = "$base_main_sha" ]
            )

            set +e
            check_immutable
            immutable_status=$?
            set -e
            if [ "$immutable_status" -ne 0 ]; then
              recovery_mode=rebuild
              health_summary='The immutable release is missing or unhealthy; current main will be fully rebuilt.'
            else
              set +e
              check_rolling
              rolling_status=$?
              set -e
              if [ "$rolling_status" -ne 0 ]; then
                recovery_mode=publish_only
                health_summary='The immutable release is healthy but windows-latest drifted; rolling publication will be repaired.'
              else
                recovery_mode=none
                health_summary='Patch contract, immutable release, and windows-latest are all healthy; build is skipped.'
              fi
            fi

            verified_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            verified_upstream_sha="$(
              gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/upstream-v1" \
                --jq '.[] | select(.ref == "refs/heads/upstream-v1") | .object.sha'
            )"
            if [ "$verified_main_sha" != "$base_main_sha" ] || \
              [ "$verified_upstream_sha" != "$previous_upstream_sha" ]; then
              echo '::error title=Stale health result::Main or upstream-v1 moved while release health was being checked.'
              exit 1
            fi

            {
              echo 'changed=false'
              echo "recovery_mode=$recovery_mode"
            } >> "$GITHUB_OUTPUT"
            {
              echo '## Upstream sync'
              echo
              echo "No update: upstream \`v1\` is still at \`$upstream_sha\`."
              echo "$health_summary"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The remaining changed-candidate path no longer needs repository API access.
          unset GH_TOKEN

          set +e
          git merge --no-ff --no-commit "$upstream_sha"
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ -z "$conflicts" ]; then
              {
                echo '## Candidate preparation failed'
                echo
                echo 'The upstream merge stopped without resolvable conflict entries.'
                echo "Base: \`$base_main_sha\`"
                echo "Upstream: \`$upstream_sha\`"
              } >> "$GITHUB_STEP_SUMMARY"
              git merge --abort || true
              exit 1
            fi

            unmanaged=''
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                .github/workflows/* | \
                  scripts/context-count-patch.ts)
                  ;;
                *) unmanaged+="$file"$'\n' ;;
              esac
            done <<< "$conflicts"

            if [ -n "$unmanaged" ]; then
              {
                echo '## Candidate preparation failed'
                echo
                echo 'Unmanaged source conflicts require review; downstream files were not overwritten:'
                echo '```text'
                printf '%s' "$unmanaged"
                echo '```'
                echo "Base: \`$base_main_sha\`"
                echo "Upstream: \`$upstream_sha\`"
              } >> "$GITHUB_STEP_SUMMARY"
              git merge --abort
              exit 1
            fi

            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                .github/workflows/sync-upstream.yml | \
                  .github/workflows/build-windows.yml | \
                  .github/workflows/cleanup-actions-storage.yml | \
                  scripts/context-count-patch.ts)
                  if git checkout --ours -- "$file" 2>/dev/null; then
                    git add -- "$file"
                  else
                    echo "::error title=Missing trusted control file::$file could not be restored."
                    git merge --abort || true
                    exit 1
                  fi
                  ;;
                .github/workflows/*)
                  git rm -f --ignore-unmatch -- "$file"
                  ;;
                *)
                  if git checkout --theirs -- "$file" 2>/dev/null; then
                    git add -- "$file"
                  else
                    git rm -f --ignore-unmatch -- "$file"
                  fi
                  ;;
              esac
            done <<< "$conflicts"
          fi

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            {
              echo '## Candidate preparation failed'
              echo
              echo 'Unresolved files remain after managed conflict handling:'
              echo '```text'
              printf '%s\n' "$unresolved"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            git merge --abort || true
            exit 1
          fi

          tracked_node_modules="$RUNNER_TEMP/tracked-node-modules.txt"
          if git ls-files -z | grep -zE '(^|/)node_modules(/|$)' > "$tracked_node_modules"; then
            echo '::error title=Tracked dependency shadowing::Candidate commits must not track any node_modules path.'
            tr '\0' '\n' < "$tracked_node_modules"
            git merge --abort || true
            exit 1
          fi

          # These control files always come from the trusted downstream base.
          git checkout "$base_main_sha" -- \
            scripts/context-count-patch.ts \
            .github/workflows/sync-upstream.yml \
            .github/workflows/build-windows.yml \
            .github/workflows/cleanup-actions-storage.yml

          while IFS= read -r -d '' index_entry; do
            metadata="${index_entry%%$'\t'*}"
            workflow_path="${index_entry#*$'\t'}"
            read -r mode object_sha stage_number <<< "$metadata"
            case "$workflow_path" in
              .github/workflows/sync-upstream.yml | \
                .github/workflows/build-windows.yml | \
                .github/workflows/cleanup-actions-storage.yml)
                expected_blob="$(git rev-parse "$base_main_sha:$workflow_path")"
                if [ "$mode" != '100644' ] || [ "$stage_number" != '0' ] || \
                  [ "$object_sha" != "$expected_blob" ]; then
                  echo "::error title=Untrusted workflow entry::$workflow_path is not the trusted 100644 base blob."
                  exit 1
                fi
                ;;
              *)
                git rm -f -r --ignore-unmatch -- "$workflow_path"
                ;;
            esac
          done < <(git ls-files --stage -z -- .github/workflows)

          workflow_index="$RUNNER_TEMP/workflow-index.txt"
          git ls-files --stage -- .github/workflows > "$workflow_index"
          for workflow_path in \
            .github/workflows/build-windows.yml \
            .github/workflows/cleanup-actions-storage.yml \
            .github/workflows/sync-upstream.yml; do
            expected_blob="$(git rev-parse "$base_main_sha:$workflow_path")"
            grep -Fxq "100644 $expected_blob 0"$'\t'"$workflow_path" "$workflow_index"
          done
          [ "$(wc -l < "$workflow_index")" -eq 3 ] || {
            echo '::error title=Workflow allowlist failure::Candidate index contains workflow entries outside the three trusted blobs.'
            cat "$workflow_index"
            exit 1
          }

          node --experimental-strip-types "$TRUSTED_CONTEXT_PATCHER" \
            --root src/renderer/src --write --require-targets --expected-targets 2 --expected-sliders 2
          node --experimental-strip-types "$TRUSTED_CONTEXT_PATCHER" \
            --root src/renderer/src --require-targets --expected-targets 2 --expected-sliders 2

          # Merge additions are already in the index; only restage modifications to tracked paths.
          # This prevents install debris from becoming part of the candidate if ignore rules change.
          git add -u -- .
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "chore(sync): merge upstream v1 @ ${upstream_sha:0:12}"
          elif ! git diff --cached --quiet; then
            git commit -m 'chore(sync): reapply context-count patch'
          else
            # Keep the candidate distinct from base when main already contains the fetched upstream.
            git commit --allow-empty -m "chore(sync): advance upstream-v1 @ ${upstream_sha:0:12}"
          fi

          candidate_sha="$(git rev-parse HEAD)"
          staging_dir="$RUNNER_TEMP/upstream-candidate-staging"
          if [ -e "$staging_dir" ] || [ -L "$staging_dir" ]; then
            echo '::error title=Unsafe staging path::Candidate staging path already exists.'
            exit 1
          fi
          mkdir "$staging_dir"
          git update-ref refs/candidate/export "$candidate_sha"
          git bundle create "$staging_dir/candidate.bundle" refs/candidate/export "^$base_main_sha"
          git update-ref -d refs/candidate/export
          printf '%s\n' \
            "candidate_sha=$candidate_sha" \
            "candidate_ref=$CANDIDATE_REF" \
            "upstream_sha=$upstream_sha" \
            "base_main_sha=$base_main_sha" \
            "previous_upstream_sha=$previous_upstream_sha" \
            > "$staging_dir/metadata.env"

          {
            echo 'changed=true'
            echo "candidate_sha=$candidate_sha"
            echo "candidate_ref=$CANDIDATE_REF"
            echo "artifact_name=$ARTIFACT_NAME"
            echo 'recovery_mode=candidate'
          } >> "$GITHUB_OUTPUT"

          {
            echo '## Upstream candidate prepared'
            echo
            echo "Candidate: \`$candidate_sha\`"
            echo "Bundle artifact: \`$ARTIFACT_NAME\`"
            echo "Base main: \`$base_main_sha\`"
            echo "Upstream: \`$upstream_sha\`"
            echo
            echo 'No remote branch has been changed. The bundle will be staged by a separate write-only job.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate bundle allowlist
        if: steps.candidate.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/upstream-candidate-staging/candidate.bundle
            ${{ runner.temp }}/upstream-candidate-staging/metadata.env
          if-no-files-found: error
          retention-days: 3

  stage:
    name: Stage candidate ref without executing candidate code
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      candidate_sha: ${{ steps.stage.outputs.candidate_sha }}
      candidate_ref: ${{ steps.stage.outputs.candidate_ref }}
      upstream_sha: ${{ steps.stage.outputs.upstream_sha }}
      base_main_sha: ${{ steps.stage.outputs.base_main_sha }}
      previous_upstream_sha: ${{ steps.stage.outputs.previous_upstream_sha }}
    steps:
      - name: Check out trusted base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.base_main_sha }}

      - name: Download candidate bundle allowlist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: staging

      - name: Verify and push candidate ref
        id: stage
        shell: bash
        env:
          EXPECTED_CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          EXPECTED_CANDIDATE_REF: ${{ needs.prepare.outputs.candidate_ref }}
          EXPECTED_UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
          EXPECTED_MAIN_SHA: ${{ needs.prepare.outputs.base_main_sha }}
          EXPECTED_PREVIOUS_UPSTREAM_SHA: ${{ needs.prepare.outputs.previous_upstream_sha }}
        run: |
          set -euo pipefail

          if [ ! -d staging ] || [ -L staging ] || \
            find staging -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            echo '::error title=Unsafe candidate artifact::staging must contain only regular top-level files.'
            exit 1
          fi
          actual_files="$(find staging -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          if [ "$actual_files" != $'candidate.bundle\nmetadata.env' ]; then
            echo '::error title=Unexpected candidate artifact::The staging artifact contains files outside the allowlist.'
            printf '%s\n' "$actual_files"
            exit 1
          fi

          read_metadata() {
            awk -F= -v key="$1" '$1 == key { sub(/^[^=]*=/, ""); print }' staging/metadata.env
          }

          candidate_sha="$(read_metadata candidate_sha)"
          candidate_ref="$(read_metadata candidate_ref)"
          upstream_sha="$(read_metadata upstream_sha)"
          base_main_sha="$(read_metadata base_main_sha)"
          previous_upstream_sha="$(read_metadata previous_upstream_sha)"

          for value in "$candidate_sha" "$upstream_sha" "$base_main_sha"; do
            [[ "$value" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error title=Invalid candidate metadata::'$value' is not a full commit SHA."
              exit 1
            }
          done
          if [ -n "$previous_upstream_sha" ] && ! [[ "$previous_upstream_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error title=Invalid candidate metadata::Previous upstream SHA is malformed.'
            exit 1
          fi
          git check-ref-format "refs/heads/$candidate_ref" >/dev/null

          [ "$candidate_sha" = "$EXPECTED_CANDIDATE_SHA" ]
          [ "$candidate_ref" = "$EXPECTED_CANDIDATE_REF" ]
          [ "$upstream_sha" = "$EXPECTED_UPSTREAM_SHA" ]
          [ "$base_main_sha" = "$EXPECTED_MAIN_SHA" ]
          [ "$previous_upstream_sha" = "$EXPECTED_PREVIOUS_UPSTREAM_SHA" ]

          git bundle verify staging/candidate.bundle
          git fetch --no-tags staging/candidate.bundle \
            'refs/candidate/export:refs/candidate/import'
          [ "$(git rev-parse refs/candidate/import)" = "$candidate_sha" ]
          git merge-base --is-ancestor "$base_main_sha" "$candidate_sha"
          git merge-base --is-ancestor "$upstream_sha" "$candidate_sha"
          if [ -n "$previous_upstream_sha" ]; then
            git cat-file -e "$previous_upstream_sha^{commit}"
            git merge-base --is-ancestor "$previous_upstream_sha" "$base_main_sha"
            git merge-base --is-ancestor "$previous_upstream_sha" "$upstream_sha"
          fi

          current_main_sha="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          current_upstream_sha="$(git ls-remote --heads origin refs/heads/upstream-v1 | awk '{print $1}')"
          if [ "$current_main_sha" != "$base_main_sha" ] || \
            [ "$current_upstream_sha" != "$previous_upstream_sha" ]; then
            echo '::error title=Stale candidate::Protected refs moved before the candidate could be staged.'
            exit 1
          fi

          git push \
            --force-with-lease="refs/heads/$candidate_ref:" \
            origin "$candidate_sha:refs/heads/$candidate_ref"
          {
            echo "candidate_sha=$candidate_sha"
            echo "candidate_ref=$candidate_ref"
            echo "upstream_sha=$upstream_sha"
            echo "base_main_sha=$base_main_sha"
            echo "previous_upstream_sha=$previous_upstream_sha"
          } >> "$GITHUB_OUTPUT"

          {
            echo '## Candidate ref staged'
            echo
            echo "Ref: \`$candidate_ref\`"
            echo "SHA: \`$candidate_sha\`"
            echo 'No file from the candidate tree was executed in this write-enabled job.'
          } >> "$GITHUB_STEP_SUMMARY"

  validate_and_promote:
    name: Validate candidate, promote, and publish
    needs: [prepare, stage]
    if: needs.stage.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/build-windows.yml
    with:
      source_sha: ${{ needs.stage.outputs.candidate_sha }}
      candidate_ref: ${{ needs.stage.outputs.candidate_ref }}
      upstream_sha: ${{ needs.stage.outputs.upstream_sha }}
      expected_main_sha: ${{ needs.stage.outputs.base_main_sha }}
      expected_upstream_sha: ${{ needs.stage.outputs.previous_upstream_sha }}
      promote_candidate: true
      release_tag: windows-latest

  recover_current_release:
    name: Repair or rebuild current Windows release
    needs: prepare
    if: >-
      needs.prepare.outputs.changed == 'false' &&
      needs.prepare.outputs.recovery_mode != 'none'
    permissions:
      contents: write
    uses: ./.github/workflows/build-windows.yml
    with:
      source_sha: ${{ needs.prepare.outputs.base_main_sha }}
      upstream_sha: ${{ needs.prepare.outputs.previous_upstream_sha }}
      release_tag: windows-latest
      publish_only: ${{ needs.prepare.outputs.recovery_mode == 'publish_only' }}

  report:
    name: Report sync result
    needs: [prepare, stage, validate_and_promote, recover_current_release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Write summary and maintain failure issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          STAGE_RESULT: ${{ needs.stage.result }}
          VALIDATION_RESULT: ${{ needs.validate_and_promote.result }}
          RECOVERY_RESULT: ${{ needs.recover_current_release.result }}
          RECOVERY_MODE: ${{ needs.prepare.outputs.recovery_mode }}
          CHANGED: ${{ needs.prepare.outputs.changed }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          CANDIDATE_REF: ${{ needs.prepare.outputs.candidate_ref }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
        run: |
          set -euo pipefail

          failed=false
          if [ "$PREPARE_RESULT" != 'success' ]; then
            failed=true
          elif [ "$CHANGED" = 'true' ] && \
            { [ "$STAGE_RESULT" != 'success' ] || [ "$VALIDATION_RESULT" != 'success' ]; }; then
            failed=true
          elif [ "$CHANGED" = 'false' ] && [ "$RECOVERY_MODE" != 'none' ] && \
            [ "$RECOVERY_RESULT" != 'success' ]; then
            failed=true
          fi

          {
            echo '## Final sync result'
            echo
            echo "Prepare: \`$PREPARE_RESULT\`"
            echo "Stage: \`$STAGE_RESULT\`"
            echo "Candidate transaction: \`$VALIDATION_RESULT\`"
            echo "Release recovery mode: \`${RECOVERY_MODE:-unavailable}\`"
            echo "Release recovery: \`$RECOVERY_RESULT\`"
            [ -n "$UPSTREAM_SHA" ] && echo "Upstream: \`$UPSTREAM_SHA\`"
            [ -n "$CANDIDATE_SHA" ] && echo "Candidate: \`$CANDIDATE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

          issue_title='[automation] Upstream sync failure'
          issue_marker='<!-- cherry-upstream-sync-failure -->'
          issue_number="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" \
              --jq '.[] | select((has("pull_request") | not) and ((.body // "") | contains("<!-- cherry-upstream-sync-failure -->"))) | .number' \
              | awk 'NF && first == "" { first=$0 } END { print first }'
          )"
          if [ -z "$issue_number" ]; then
            issue_number="$(
              gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 100 \
                --json number,title \
                --jq '[.[] | select(.title == "[automation] Upstream sync failure")][0].number // empty'
            )"
          fi

          if [ "$failed" = 'true' ]; then
            body="$RUNNER_TEMP/upstream-sync-failure.md"
            {
              echo "$issue_marker"
              echo 'The automated upstream candidate transaction did not complete.'
              echo
              echo "- Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo "- Prepare: \`$PREPARE_RESULT\`"
              echo "- Stage: \`$STAGE_RESULT\`"
              echo "- Candidate transaction: \`$VALIDATION_RESULT\`"
              echo "- Release recovery mode: \`${RECOVERY_MODE:-unavailable}\`"
              echo "- Release recovery: \`$RECOVERY_RESULT\`"
              echo "- Upstream SHA: \`${UPSTREAM_SHA:-unavailable}\`"
              echo "- Candidate SHA: \`${CANDIDATE_SHA:-unavailable}\`"
              echo "- Diagnostic ref: \`${CANDIDATE_REF:-not-created}\`"
              echo
              echo 'Review the run summary and the first failed job. Branch updates are lease-guarded, and every accepted build has an immutable release.'
            } > "$body"

            if [ -n "$issue_number" ]; then
              gh issue reopen "$issue_number" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
              gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --body-file "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$issue_title" --body-file "$body"
            fi
            echo '::error title=Upstream sync transaction failed::A diagnostic issue was created or updated.'
            exit 1
          else
            if [ "$CHANGED" = 'false' ]; then
              if [ "$RECOVERY_MODE" = 'none' ]; then
                echo 'Upstream is unchanged; patch and both release layers are healthy.' >> "$GITHUB_STEP_SUMMARY"
              else
                echo "Upstream is unchanged; release recovery completed in \`$RECOVERY_MODE\` mode." \
                  >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo 'The validated candidate was promoted, published, and remotely verified.' >> "$GITHUB_STEP_SUMMARY"
            fi

            if [ -n "$issue_number" ]; then
              issue_state="$(gh issue view "$issue_number" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')"
              if [ "$issue_state" = 'OPEN' ]; then
                gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" \
                  --comment "Resolved by run https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              fi
            fi
          fi
